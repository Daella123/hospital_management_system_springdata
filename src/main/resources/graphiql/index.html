<!DOCTYPE html>
<html lang="en">
<head>
    <title>GraphiQL — Hospital API</title>
    <style>
        body { height: 100%; margin: 0; width: 100%; overflow: hidden; }
        #graphiql { height: 100vh; }
    </style>
    <!--
        Assets loaded from jsDelivr (more reliable globally than unpkg).
        No WebSocket/subscriptionUrl — avoids the "Loading..." hang that occurs
        when the browser tries a WebSocket handshake that the server never completes.
    -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/graphiql/graphiql.min.js" crossorigin></script>
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/graphiql/graphiql.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@graphiql/plugin-explorer/dist/index.umd.js" crossorigin></script>
    <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@graphiql/plugin-explorer/dist/style.css" />
</head>
<body>
<div id="graphiql">Loading...</div>
<script>
    const url = `${location.protocol}//${location.host}/graphql`;
    const fetcher = GraphiQL.createFetcher({ url });
    const explorerPlugin = GraphiQLPluginExplorer.explorerPlugin();

    const root = ReactDOM.createRoot(document.getElementById('graphiql'));
    root.render(
        React.createElement(GraphiQL, {
            fetcher: fetcher,
            defaultVariableEditorOpen: true,
            headerEditorEnabled: true,
            shouldPersistHeaders: true,
            plugins: [explorerPlugin],
        })
    );
</script>
</body>
</html>
